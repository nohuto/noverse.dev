<!DOCTYPE html>
<!-- Copyright (c) 2026 nohuto -->
<html lang="en" data-theme-setting="gruvbox-dark" data-theme="gruvbox-dark" data-bg="crosshatch">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="My Open Source Projects">
  <title>Projects - Noverse</title>
  <!-- include:site-head -->
</head>

<body>
  <!-- include:site-header -->

  <main id="main" class="no-center">
    <section class="content-box panel" data-title="projects">
      <div class="panel-body">
        <h1 class="page-heading">My Open Source Projects</h1>
        <div class="page-divider"></div>
        <div class="project-filter">
          <div class="filter-row">
            <div class="nv-search-box">
              <span class="nv-search-icon" aria-hidden="true"></span>
              <input id="project-search" type="text" aria-label="Search projects" aria-keyshortcuts="Control+K">
              <kbd class="nv-search-shortcut" aria-hidden="true" hidden><kbd>Ctrl</kbd><kbd>K</kbd></kbd>
            </div>
          </div>
        </div>
        <section class="project-group" aria-labelledby="active-projects-title">
          <div class="section-heading">
            <h2 id="active-projects-title">Active projects</h2>
          </div>
          <div class="project-grid">
            <!-- component:project-cards:active -->
          </div>
        </section>
        <section class="project-group" aria-labelledby="resource-projects-title">
          <div class="section-heading">
            <h2 id="resource-projects-title">Resource repos</h2>
          </div>
          <div class="project-grid">
            <!-- component:project-cards:resources -->
          </div>
        </section>
        <section class="project-group" aria-labelledby="web-projects-title">
          <div class="section-heading">
            <h2 id="web-projects-title">Web tools</h2>
          </div>
          <div class="project-grid">
            <!-- component:project-cards:web -->
          </div>
        </section>
        <section class="project-group" aria-labelledby="powershell-projects-title">
          <div class="section-heading">
            <h2 id="powershell-projects-title">PS obfuscation / minification / conversion</h2>
          </div>
          <div class="project-grid">
            <!-- component:project-cards:powershell -->
          </div>
        </section>
        <section class="project-group" aria-labelledby="website-projects-title">
          <div class="section-heading">
            <h2 id="website-projects-title">Websites</h2>
          </div>
          <div class="project-grid">
            <!-- component:project-cards:websites -->
          </div>
        </section>
        <section class="project-group" aria-labelledby="misc-projects-title">
          <div class="section-heading">
            <h2 id="misc-projects-title">Misc</h2>
          </div>
          <div class="project-grid">
            <!-- component:project-cards:misc -->
          </div>
        </section>
        <section class="project-group" aria-labelledby="archive-projects-title">
          <div class="section-heading">
            <h2 id="archive-projects-title">Archive</h2>
          </div>
          <div class="project-grid">
            <!-- component:project-cards:archive -->
          </div>
        </section>
        <p class="project-empty" id="project-empty" hidden>No matching project(s)</p>
      </div>
    </section>
  </main>

  <!-- include:site-footer -->
</body>

</html>
